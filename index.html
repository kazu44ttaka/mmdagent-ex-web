<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMDAgent-EX Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%235aa2ff%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="viewport" aria-label="3D 表示"></main>

  <button id="toggle-panel" type="button" title="操作欄の表示を切り替え" aria-label="操作欄の表示を切り替え">☰</button>

  <aside id="panel">
    <h1>MMDAgent-EX Web</h1>

    <section>
      <h2>1. コンテンツ</h2>
      <label class="file">
        <span>フォルダーを選ぶ</span>
        <input id="folder" type="file" webkitdirectory multiple />
      </label>
      <p class="hint">MMDAgent-EX のコンテンツのフォルダー（例: <code>example</code>）を選ぶか、この画面にドロップします。ファイルはブラウザーの中だけで読み、どこにも送りません。</p>
      <label>.mdf
        <select id="mdf" disabled></select>
      </label>
      <button id="start" type="button" disabled>開始</button>
      <p class="hint">表示中: <span id="scene-status">なし</span></p>
    </section>

    <section>
      <h2>2. 接続</h2>
      <label>WebSocket の接続先
        <input id="ws-url" type="text" spellcheck="false" autocomplete="off" />
      </label>
      <div class="row">
        <button id="connect" type="button">接続</button>
        <span id="status" data-kind="idle">切断</span>
      </div>
      <label class="inline"><input id="recog" type="checkbox" /> マイクの音声認識（RECOG_EVENT_*）</label>
      <p class="hint">MMDAgent-EX の Plugin_Remote と同じく、接続先の WebSocket サーバーに自分からつなぎます。既定値は .mdf の <code>Plugin_Remote_Websocket_*</code> から作ります。</p>
    </section>

    <section class="grow">
      <div class="row">
        <h2>ログ</h2>
        <label class="inline"><input id="log-all" type="checkbox" /> すべて表示</label>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </section>
  </aside>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
